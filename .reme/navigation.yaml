documents:
  - path: AGENTS.md
    read_when: 需要确认 Git、安全边界、闭测范围与测试规模时
    role: specification
    lifecycle: decision

  - path: docs/HANDOFF.md
    read_when: 需要恢复当前分支、部署状态、架构约束与已知陷阱时
    role: progress
    authority: approved

  - path: docs/BACKLOG.md
    read_when: 需要选择下一项工作、判断反馈是否推迟，或确认 SessionPad 探索边界时
    role: plan
    status: stale

  - path: docs/PROGRESS.md
    read_when: 需要追溯里程碑、历史验证结果或旧上下文归档位置时
    role: progress

  - path: docs/deploy-closed-beta.md
    read_when: 获得明确批准后，需要部署开放注册代码、执行发布检查、后续开启或回滚时
    role: plan
    lifecycle: decision

  - path: docs/plans/2026-08-09-open-registration.md
    read_when: 需要实施、审核或发布低流量邮箱开放注册时
    role: plan
    authority: approved

  - path: docs/plans/2026-08-14-public-seo-content.md
    read_when: 需要实施、审核或批准公开 Q&A/Blog 与 SEO 内容页时
    role: plan

  - path: docs/research/2026-08-09-resend-email-contract.md
    read_when: 需要审核 Resend adapter、邮件错误处理或 OR4 投递保障时
    role: research
    lifecycle: artifact
    authority: reference
