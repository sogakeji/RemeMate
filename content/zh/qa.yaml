title: RemeMate 常见问题
description: RemeMate 怎么用：从收词、复习到输出，每一步怎么操作、出问题怎么办，给新用户的图文版常见问题。
indexable: false
items:
  - question: 1.1 RemeMate 是什么？适合谁？
    answer: |
      **一句话结论**

      把「背一份通用词表」换成「收下真实遇到的词 → 间隔复习 → 用造句、日记或语伴复盘输出」的个人学习工具。

      **功能解释**

      适合已经在读、听、说，但词记不住、也用不出去的人。登录后首页就是当天到期的复习；词库用来收词，写一写用来输出，语言伙伴用来做一对一复盘。

      公开介绍见 [首页](/)。

      ![RemeMate 中文首页，标题说明收词、复习、输出闭环](public/qa/zh/faq-01-landing-zh.png)

      **注意事项**

      这是网页里的个人词库和复习，不是课程、不是聊天室，也不替代真人老师。

      **故障怎么办**

      打不开首页时先换浏览器或刷新；仍不行见 8.6。
  - question: 1.2 怎么注册和登录？
    answer: |
      **一句话结论**

      用邮箱注册、完成验证后再登录；忘记密码可以走重置邮件。

      **功能解释**

      1. 打开注册页，填写邮箱和密码。
      2. 到邮箱点开验证链接。
      3. 回到登录页用同一邮箱登录。

      ![中文注册页，含邮箱、密码和提交按钮](public/qa/zh/faq-03-register-zh.png)

      ![中文登录页，含邮箱、密码和忘记密码链接](public/qa/zh/faq-02-login-zh.png)

      **注意事项**

      注册入口由运营开关控制。开关关闭时，页面只保留登录，没有公开注册。不要把「现在能注册」理解成永远开放。

      **故障怎么办**

      收不到验证信或忘了密码，见 1.5。
  - question: 1.3 界面语言和学习语言怎么设置？
    answer: |
      **一句话结论**

      界面只有中文和英语；学习语言在设置里勾选，和界面语言不是一回事。

      **功能解释**

      - 界面语言：页面右上角在中文 / English 之间切换。
      - 学习语言：登录后打开设置，勾选正在学的语言，并选择母语（讲解语言）。
      - AI 可用：中文、英语、法语、日语、韩语、西班牙语。
      - 阅读器可用：中文、英语、法语、日语。

      ![设置页语言区，显示界面语言与正在学的语言](public/qa/zh/faq-04-settings-language-zh.png)

      **注意事项**

      德语、俄语只保留历史数据兼容，新入口已隐藏。换学习语言不会删词，见 6.2。

      **故障怎么办**

      设置里看不到某门语言时，先确认它属于上面列出的范围；阅读器查不到词典见 8.5。
  - question: 1.4 有哪些入口？手机上能用吗？
    answer: |
      **一句话结论**

      这是浏览器里的网页应用，不必安装 App；手机浏览器也能用。

      **功能解释**

      登录后顶栏大致是：首页（复习）、写一写、语言伙伴、词库、我的。电脑和手机都走同一套网址，移动端是响应式布局。

      **注意事项**

      没有独立的手机 App、小程序或桌面客户端。请用可以打开网页的浏览器。

      **故障怎么办**

      手机上按钮被挡住时，可先横屏或放大页面；页面打不开见 8.6。
  - question: 1.5 忘了密码 / 收不到验证邮件怎么办？
    answer: |
      **一句话结论**

      用「忘记密码」重设；验证信先查垃圾箱，再重发，仍不行联系管理员。

      **功能解释**

      1. 登录页点忘记密码，填写注册邮箱。
      2. 按邮件里的链接设置新密码。
      3. 注册后若未验证，按页上提示重发验证邮件。

      **注意事项**

      系统不会在页面上告诉你「这个邮箱有没有注册」，避免泄露账号。邮件可能进垃圾箱或延迟几分钟。

      **故障怎么办**

      核对邮箱拼写，等几分钟再看垃圾箱；仍没有就联系管理员，并说明用的是哪一个邮箱。
  - question: 2.1 有哪些收词方式？
    answer: |
      **一句话结论**

      可以手动加词、让 AI 填充、从文本 / CSV / PDF 收词、在阅读里点词，也可以从语伴复盘或反馈包收下表达。

      **功能解释**

      - 手动添加：词库 → 手动加词，直接进生词本。
      - AI 填充：加词时生成释义、例句或笔记。
      - 文本抽词 / CSV 导入：先变成候选词，审核后再入库。
      - 阅读：打开 PDF，点生词查询并加入学习。
      - 复盘「帮自己记」、以及对方发来的反馈包：审核后进自己的词库。

      ![词库列表页，可进入手动加词、导入和阅读](public/qa/zh/faq-05-word-list-zh.png)

      **注意事项**

      「导入」通常指 CSV 批量进词。不同入口的审核、额度不一样，不要以为只有一种收词。

      **故障怎么办**

      词没有出现在生词本时：先看当前学习语言是否一致，再看候选审核里是否还没点入库。
  - question: 2.2 手动添加一个词，需要填什么？
    answer: |
      **一句话结论**

      至少要有词，以及词性或释义之一；例句和笔记可选，也可以让 AI 补。

      **功能解释**

      打开词库 → 手动加词。选择语言，填写词，可加多条释义（词性、释义、例句、笔记）。可用「AI 填充」整词，或单独生成例句、笔记。保存后直接进生词本并可以复习，不经过候选审核。

      ![手动加词页，含词条、释义和 AI 填充按钮](public/qa/zh/faq-06-add-word-zh.png)

      **注意事项**

      同语言下已有相同的词时，系统不会用新内容覆盖旧释义。AI 填充会消耗当日 AI 配额。

      **故障怎么办**

      保存失败时检查是否选了学习语言、词是否为空。AI 填不出来见 8.1。
  - question: 2.3 导入：文本 / CSV / PDF 怎么用？
    answer: |
      **一句话结论**

      先选出语言和材料，系统抽出候选词，你逐条接受或忽略，再提交入库。

      **功能解释**

      - CSV：词库 → CSV 导入。UTF-8 逗号分隔，第一行是表头。必须有词列和释义列（如 `word` / `单词` 与 `meaning` / `释义`）。可选词性、例句、笔记。
      - 文本抽词：粘贴一段文字，由 AI 抽出可能陌生的词，再进候选。
      - PDF：走阅读器，点词查询后再加入学习，不是把整份 PDF 一次变成词表。

      上传或抽词后会进入处理页，然后到候选审核。只有你提交入库，词才会进生词本。

      ![CSV 导入页，含语言选择和上传按钮](public/qa/zh/faq-08-import-zh.png)

      ![候选审核页，可逐条接受或忽略](public/qa/zh/faq-09-candidates-zh.png)

      **注意事项**

      只接受 `.csv`，不接受 Excel、Anki 包或 TSV 一键导入。请先另存为 UTF-8 CSV。导入有每日上限，页顶看得到。入库后的新词会马上出现在该语言的复习里。

      **故障怎么办**

      - 提示格式不受支持：另存 UTF-8，确认第一行是表头，且有词列和释义列。
      - 提示文件过大：拆成更小的 CSV。
      - 处理停住：不要关页，稍后重新打开处理页。
      - 生词本是空的：可能还没点入库，或右上角语言和导入时不一致。
  - question: 2.4 阅读中怎么收集？
    answer: |
      **一句话结论**

      上传 PDF，点不认识的词查本地词典，再加入学习，最后回词库审核。

      **功能解释**

      词库 → 阅读收词，上传文章。在正文里点选生词，查看释义，点加入学习。这些词先进入该文档的候选，接受后才进生词本。阅读器支持中文、英语、法语、日语。

      ![上传阅读材料表单，选择语言并上传 PDF](public/qa/zh/faq-10-reading-new-zh.png)

      ![阅读页正文与生词查询卡片](public/qa/zh/faq-10-reading-zh.png)

      **注意事项**

      阅读收词不是在线词典，也不是把整本书自动拆成词表。已在生词本里的词会提示已存在。

      **故障怎么办**

      某语言查不到释义，见 8.5。加入后列表里没有，去该次阅读的候选页看一眼。
  - question: 2.5 候选词是什么？为什么要审核？
    answer: |
      **一句话结论**

      候选是「待定」：你接受之后才进词库、才参加复习，避免垃圾词冲进今天的卡片。

      **功能解释**

      CSV、文本抽词、阅读收词、复盘和反馈包都会先变成候选。在候选页可以接受、忽略。手动加词不走这一步。

      ![候选审核列表，显示待审核词条](public/qa/zh/faq-09-candidates-zh.png)

      **注意事项**

      处理完不等于已经入库。忽略只表示这次不要，不是永久拉黑该词。

      **故障怎么办**

      审核过了生词本仍没有：确认点的是入库/接受，并检查当前学习语言。
  - question: 2.6 SessionPad 是什么？
    answer: |
      **一句话结论**

      和语伴交流时用的复盘信纸：帮自己记的内容进你的候选词，帮他记的内容可整理成反馈包发给对方。

      **功能解释**

      先在语言伙伴里选一位语伴，打开一张复盘。会中或会后写下想记住的表达。帮自己记里的词语和自然说法可以加入候选；帮他记需要你勾选后才发送。对方登录并绑定后，才能收到反馈包。

      ![SessionPad 候选审核页，显示来自复盘的待审表达](public/qa/zh/faq-11-sessionpad-candidates-zh.png)

      **注意事项**

      这不是聊天室、共享文档，也不是独立 App。系统不会把整场对话自动拆词入库。私人伙伴笔记默认私有，也不会发给 AI。

      **故障怎么办**

      发不出去时：确认双方已绑定，且勾选的是「帮他记」。候选进不了词库时，走专属审核页逐条接受。
  - question: 2.7 词库页能做什么？
    answer: |
      **一句话结论**

      按语言查看自己的词，编辑、删除、打星，并打开词条看释义、例句和笔记。

      **功能解释**

      词库列表可搜索、按到期/最近/遗忘次数排序，也可只看已标记。点开词条看详情，需要改释义就编辑。删除会一并去掉该词的复习记录。

      ![词库列表，含搜索、语言和词条](public/qa/zh/faq-05-word-list-zh.png)

      ![词条详情，显示释义、例句和笔记](public/qa/zh/faq-07-word-detail-zh.png)

      **注意事项**

      词库按语言分开，界面不会让你「新建一本词表」。星标可在列表或复习卡上切换。

      **故障怎么办**

      找不到词时，先切换到该词所属的学习语言，再搜词形。
  - question: 3.1 复习是怎么安排的？
    answer: |
      **一句话结论**

      到期才出现：间隔重复（SRS）按你上次的打分安排下一次，今天要复习的词显示在首页。

      **功能解释**

      登录后的首页就是当前学习语言的复习卡片，不是仪表盘。独立复习页也还在。新收下或刚入库的词通常马上可以复习。

      ![登录后首页的任务卡，显示今天到期的复习数量](public/qa/zh/faq-00-home-task-zh.png)

      **注意事项**

      队列跟当前主攻语言走。切到另一种语言，另一种语言的到期词才会出现。不会自动把大批新词摊到后面几天。

      **故障怎么办**

      首页说今天没有词：可能已经复习完，或语言切错了。去设置确认正在学的语言。
  - question: 3.2 复习时怎么打分？按钮代表什么？
    answer: |
      **一句话结论**

      三档决定下次间隔：没记住、有点模糊、秒记起。

      **功能解释**

      先看词形，再点开释义、例句和笔记，然后打分：

      - **没记住**：想不起来。间隔会缩短，大约 10 分钟后再出现。
      - **有点模糊**：想起来但费劲。算通过，间隔照常递推，熟练度略降。
      - **秒记起**：轻松想起。间隔拉长。

      ![复习卡片上的三个打分按钮：没记住、有点模糊、秒记起](public/qa/zh/faq-12-review-zh.png)

      **注意事项**

      同一张到期卡只能评一次。回看上一张不会重新计分。

      **故障怎么办**

      误点了没记住：等它按新间隔回来即可，没有「撤销这一下」的单独按钮。
  - question: 3.3 AI 短故事是什么？怎么用？
    answer: |
      **一句话结论**

      把你今天复习过、尤其是快忘的词编成一小段故事，读完可以顺手去造句。

      **功能解释**

      当天该语言有效复习满一定数量后，才出现短故事入口。故事用你的词写成短文，失败可以重试。可以从故事里的目标词跳到造句。

      ![复习短故事页，展示含目标词的短文](public/qa/zh/faq-13-story-zh.png)

      **注意事项**

      生成会消耗 AI 配额。失败不会丢掉刚才的复习记录。中文、法文目前比其他语言更容易生成失败，见 8.2。

      **故障怎么办**

      点重试；仍失败就改天再试，或先用手写造句。不要重复猛点。
  - question: 3.4 手机提醒（Bark）是什么？
    answer: |
      **一句话结论**

      可选的每日复习推送：在设置里填写 Bark 地址，系统会提醒你还有到期的词。

      **功能解释**

      打开设置 → Bark 推送，填入你的 Bark key / 地址，可用测试发送确认。推送打开后是一张单卡复习页。

      ![设置页中的 Bark 推送填写区和测试按钮](public/qa/zh/faq-04-settings-language-zh.png)

      **注意事项**

      Bark 是第三方推送，不是 RemeMate 自己的 App 通知。没有到期词时，可能不会发。

      **故障怎么办**

      见 8.4。
  - question: 3.5 复习完的词去哪里了？历史怎么看？
    answer: |
      **一句话结论**

      词还在生词本里，只是下次到期日往后了；进度在统计页。

      **功能解释**

      我的 → 统计，查看各语言的复习量和其他学习记录。词本身仍可在词库打开、编辑。

      ![统计页，显示各语言复习进度](public/qa/zh/faq-20-stats-zh.png)

      **注意事项**

      统计是回顾，不是另一套词库。删词会删掉该词的复习日志。

      **故障怎么办**

      统计是空的：确认已经打过分，且看的是对应语言。
  - question: 4.1 造句怎么用？
    answer: |
      **一句话结论**

      对着一个目标词写一句话，先让 AI 批改，再决定保存；也可以发到句子广场。

      **功能解释**

      写一写 → 造句。系统会推荐待复习或相关的词。提交后只批改，结果先放在当次会话里。你显式保存才会进历史；也可以丢弃。已保存的句子可从历史发布到广场。

      ![造句页，含目标词、输入框和提交](public/qa/zh/faq-14-write-zh.png)

      **注意事项**

      批改用设置里的讲解语言来写说明。句子语言和目标词语言不一致时会提示。AI 不可用时给降级结果，不会偷偷入库。

      **故障怎么办**

      写不了时先看当日 AI 配额。批改完刷新不会自动再交一次。配额见 7.1。
  - question: 4.2 三行日记是什么？
    answer: |
      **一句话结论**

      用刚学的词写三行短日记，同样可以让 AI 批改。

      **功能解释**

      写一写里切换到三行日记。按提示写三行，提交批改，再选择保存或丢弃。节奏比造句更短。

      ![三行日记页，三个输入行和提示](public/qa/zh/faq-15-diary-zh.png)

      **注意事项**

      和造句共用写作相关的 AI 配额。保存前可以丢弃，不会进词库。

      **故障怎么办**

      某一行超长或语言不匹配时，按页上的提示改完再提交。
  - question: 4.3 AI 批改怎么工作？会替换我的句子吗？
    answer: |
      **一句话结论**

      批改是建议，不是替你改写入库；原文还在，词库不会被批改改掉。

      **功能解释**

      提交后会看到反馈、翻译或错误提示。保存的是你确认过的内容。批改会消耗配额。

      ![批改结果，原文与建议同时可见](public/qa/zh/faq-14-write-zh.png)

      **注意事项**

      没有口语打分或发音评测。AI 不会自动用「更好的句子」覆盖你的词库例句。

      **故障怎么办**

      结果异常或空白：丢弃本次，检查配额后重试。见 8.1。
  - question: 4.4 句子广场是什么？
    answer: |
      **一句话结论**

      登录用户能看到的公开句子和日记墙，可按语言筛选、点赞；只有你主动发布的内容会出现。

      **功能解释**

      写一写 → 历史里发布，或打开广场浏览别人的句子。作者可以撤回自己的发布。

      ![句子广场列表，含语言筛选和点赞](public/qa/zh/faq-16-square-zh.png)

      **注意事项**

      广场不是搜索引擎收录页，也没有评论串或举报流程。未发布的写作只有自己看得见。

      **故障怎么办**

      发布后看不见：确认点的是发布而不是只保存，并检查广场的语言筛选。
  - question: 4.5 输出后如何回到收词/复习？
    answer: |
      **一句话结论**

      短故事可以跳到造句，保存后再回首页继续复习，或回词库收下新词。

      **功能解释**

      常见闭环：复习打分 →（可选）读短故事 → 用目标词造句或写日记 → 保存 → 回首页或词库。语伴复盘里收下的表达，审核后也会回到同一套复习。

      **注意事项**

      输出不会自动改复习间隔，除非你之后又给这个词打了分。造句保存成功后，下一次造句推荐会换词。

      **故障怎么办**

      从故事跳不出去句：直接打开写一写，手动带上那个词。
  - question: 5.1 语伴功能是什么？和普通社交有什么区别？
    answer: |
      **一句话结论**

      这是私人的一对一语言伙伴，用来做复盘和反馈，不是公开社交动态。

      **功能解释**

      语言伙伴里看到的是你自己的伙伴列表。围绕一位语伴记复盘、发反馈包。对方默认看不到你的生词本或历史复盘。

      ![语言伙伴列表，显示已有伙伴入口](public/qa/zh/faq-17-partners-zh.png)

      **注意事项**

      不是聊天室、小组交换或实时共编。未绑定的档案只存在你这边，对方看不见。

      **故障怎么办**

      列表是空的：先手动创建伙伴档案，需要对方参与时再发邀请。
  - question: 5.2 怎么邀请 / 绑定语伴？
    answer: |
      **一句话结论**

      你生成邀请链接，对方用对应邮箱登录后确认，才完成绑定。

      **功能解释**

      在伙伴档案里填写对方的 RemeMate 登录邮箱，生成邀请。对方打开链接并确认后，未来的反馈包才有明确收件人。对方也可以再确认一份自己这边的伙伴档案，双方各自记自己的复盘。

      **注意事项**

      邀请不会告诉你对方有没有注册。链接有有效期。绑定不会把你过去的复盘或词库复制给对方。

      **故障怎么办**

      对方打不开邀请：重新生成一封（旧链接会作废）。不能绑自己的账号。确认页只预填昵称和语言方向。
  - question: 5.3 复盘（Recap）是什么？
    answer: |
      **一句话结论**

      一张围绕这位语伴的学习信纸：帮自己记默认私有，帮他记筛选后才能发给对方。

      **功能解释**

      - **帮自己记**：想记住的词句、对方的自然说法、私人笔记、下次想聊的话题。
      - **帮他记**：值得对方记住的表达、纠正、更自然的说法、下次建议。

      会中可以随手写，会后也可以再整理。只有帮自己记里的词语/表达、句子/自然说法能进你的候选词。

      ![复盘表单，可在帮自己记与帮他记之间切换](public/qa/zh/faq-18-recap-zh.png)

      **注意事项**

      两人不会共同编辑同一份信纸。私人笔记永远默认私有。系统不会自动把整场对话变成词。

      **故障怎么办**

      加不进自己的词库：确认写在「帮自己记」，并且类型是词语或自然说法，再走候选审核。
  - question: 5.4 反馈包（Feedback Packet）怎么用？
    answer: |
      **一句话结论**

      对方收到的是快照副本：可以点一次感谢，也可以把其中的表达收进自己的候选词。

      **功能解释**

      发送者在当前复盘里勾选「帮他记」再发送。收件人在「收到的反馈」里查看。采纳时由接收方自己整理词，不会替对方改词库。

      ![反馈包收件箱，列出收到的反馈](public/qa/zh/faq-19-packets-zh.png)

      **注意事项**

      发送后你再改原复盘，不会改已发出的包。需要补充就再发一份。感谢不是评论，也不能撤回。

      **故障怎么办**

      对方说没收到：确认已绑定，且发送的是帮他记。看不到采纳入口时，先把该语言加进自己的「正在学」。
  - question: 5.5 隐私边界是什么？
    answer: |
      **一句话结论**

      私人伙伴笔记不发给 AI；对方看不到你的词库和历史复盘；帮自己记默认私有。

      **功能解释**

      只有被选进反馈包的「帮他记」条目会给指定伙伴。绑定只是让以后的包有收件人，不是授权翻历史。生成复盘总结时，私人笔记不会送出。

      ![复盘页上的私有说明，标明私人笔记不会发送](public/qa/zh/faq-18-recap-zh.png)

      **注意事项**

      广场上只有你主动发布的句子或日记。没有单独的公开隐私政策页，这里只描述产品行为。

      **故障怎么办**

      担心发错内容：先检查勾选的是否都是帮他记。已经发出的包不能改，只能再发补充说明。
  - question: 6.1 支持哪些语言？
    answer: |
      **一句话结论**

      界面中文/英语；AI 中英法日韩西；阅读器中英法日。

      **功能解释**

      在设置里勾选正在学的语言。讲解语言（母语）决定批改和部分说明用哪种话来写。界面语言只影响菜单和按钮。

      ![设置页语言选项，列出可学习的语言](public/qa/zh/faq-04-settings-language-zh.png)

      **注意事项**

      德语、俄语见 6.3。阅读器比 AI 少韩语和西班牙语。

      **故障怎么办**

      某功能没有该语言：换其他收词方式，或只用复习/造句，不走阅读器。
  - question: 6.2 换学习语言会丢数据吗？
    answer: |
      **一句话结论**

      不会。词库按语言分开，切换只换入口，数据还在。

      **功能解释**

      每种学习语言有自己的词和复习队列。右上角或词库筛选换语言，只是改「现在看哪一本」。

      ![词库按语言筛选后的列表](public/qa/zh/faq-05-word-list-zh.png)

      **注意事项**

      导入或复盘时选错语言，词会进那一门语言。回家页时也要切回同一门，才能复习到。

      **故障怎么办**

      「词丢了」时先把语言切回当初收下它的那一门，再在词库搜索。
  - question: 6.3 德语/俄语等旧语言为什么看不到了？
    answer: |
      **一句话结论**

      历史数据仍兼容，新入口已隐藏，避免再往这两门语言加新词。

      **功能解释**

      以前已经收下的德语、俄语词还在库里，不会被这次隐藏删掉。新的加词、导入、阅读入口不再提供这两门。

      **注意事项**

      这不是「语言被删除」，只是不再作为新的学习入口。

      **故障怎么办**

      需要继续复习旧词时，请联系管理员确认你的账号里是否仍能切到该语言数据；不要指望在新表单里再选德语或俄语。
  - question: 7.1 AI 功能有配额吗？怎么算？
    answer: |
      **一句话结论**

      有。AI 填充、批改、短故事、复盘相关生成等会消耗每日 token 配额，第二天按你的时区重置。

      **功能解释**

      页上或提交失败时会提示额度。不是每一次打开页面都扣；真正调用模型时才记。不同功能可能走不同计数，但都受当日总量约束。

      **注意事项**

      具体数字以页面当时显示为准。设置里没有给普通用户填写自己 API key 的入口。

      **故障怎么办**

      提示额度用完：见 7.2。
  - question: 7.2 配额用完了怎么办？
    answer: |
      **一句话结论**

      当天等重置；急需时联系管理员。

      **功能解释**

      过了你账号时区的午夜会清零。在此之前仍可手动加词、复习、看词库，只是 AI 相关动作会失败或降级。

      **注意事项**

      不要为了「再试一次」连续提交批改，失败的调用也可能计数。

      **故障怎么办**

      确认系统时间/时区设置是否明显不对；仍异常就联系管理员，说明大概什么时间用完。
  - question: 7.3 我的数据安全吗？
    answer: |
      **一句话结论**

      词库、复盘和未发布写作默认只属于你；库有用户隔离，私人笔记不参与 AI 总结。

      **功能解释**

      语言伙伴只能看到你发给他的反馈包条目。绑定不会打开历史复盘。登录失败、注册是否存在，对外都用同一套含糊回复。

      **注意事项**

      没有公开的隐私政策页，也没有「注册永远免费开放」的承诺。运营可以开关注册。我们不会在这里描述服务器机房或备份天数。

      **故障怎么办**

      发现不该被对方看到的内容：立刻停止继续发送，并联系管理员说明是哪个伙伴、哪一份反馈。
  - question: 7.4 可以把数据带走吗？
    answer: |
      **一句话结论**

      目前不提供整库导出或自助销号。

      **功能解释**

      你可以在词库里逐条查看、编辑或删除自己的词。句子历史里可以撤回已发布内容。没有一键下载全部数据的按钮。

      **注意事项**

      不要把 CSV 导入理解成「也能按同样格式导出」。FAQ 不承诺上线导出的时间。

      **故障怎么办**

      需要处理账号数据时，联系管理员，不要尝试用非正式脚本对生产库操作。
  - question: 8.1 AI 生成失败 / 报错怎么办？
    answer: |
      **一句话结论**

      先看配额和网络，再重试一次；反复失败就停手并联系管理员。

      **功能解释**

      常见原因：当日配额用完、网络中断、模型服务波动。短故事、填充、批改都可能遇到。失败时你的词和复习记录还在。

      **注意事项**

      连续重试可能继续消耗配额。不要把一次失败理解成词被删了。

      **故障怎么办**

      等一两分钟重试；仍不行就改天或改用手填。联系管理员时附上大概时间和功能名称（填充 / 批改 / 短故事）。
  - question: 8.2 短故事中文/法文偶尔生成失败？
    answer: |
      **一句话结论**

      这两种语言目前不如其他语言稳定；系统会有界重试，失败也不会丢掉复习记录。

      **功能解释**

      英文、日文、韩文、西班牙文相对更稳。中文、法文可能在重试后仍失败。韩文偶尔第一次失败、再试成功。

      **注意事项**

      这是已知限制，不能宣称六种语言的短故事都稳定可用。

      **故障怎么办**

      用页上的重试。多次失败就先跳过故事，直接造句。不必重复生成来「补数据」。
  - question: 8.3 验证邮件收不到？
    answer: |
      **一句话结论**

      查垃圾箱、等几分钟重发、核对邮箱拼写；还没有就找管理员。

      **功能解释**

      注册和重置密码都走邮件。页上成功提示不代表邮箱一定存在，只表示请求已接受。

      ![注册后的验证提示，说明去邮箱点开链接](public/qa/zh/faq-03-register-zh.png)

      **注意事项**

      公司邮箱或严格过滤的服务商更容易拦信。不要用临时邮箱。

      **故障怎么办**

      换一个常用邮箱重新注册前，先请管理员确认旧地址有没有留下未验证账号。
  - question: 8.4 Bark 推送没收到？
    answer: |
      **一句话结论**

      检查 key 是否填对，先测发送，并确认今天这门语言真的有到期词。

      **功能解释**

      设置里保存 Bark 地址后点测试。测试通了但早上没推送，可能是当天没有到期复习，或定时任务尚未跑到。

      **注意事项**

      地址不能指向本机或内网。Bark 应用本身也要允许通知。

      **故障怎么办**

      测试失败：重填官方给出的地址。测试成功仍无每日提醒：确认有到期词，次日再观察；仍无则联系管理员。
  - question: 8.5 阅读器查不到某语言词典？
    answer: |
      **一句话结论**

      阅读器只支持中文、英语、法语、日语；韩语、西班牙语请改用其他收词方式。

      **功能解释**

      点词查询走本地词典数据，不是在线词典。不在这四种语言里的文章，查询会空。

      **注意事项**

      不要把「AI 能批改韩语/西语」理解成「阅读器也能查韩语/西语」。

      **故障怎么办**

      改用手动加词、文本抽词或 CSV。词形复制错了也会查不到，先核对拼写。
  - question: 8.6 页面打不开 / 报 500？
    answer: |
      **一句话结论**

      先刷新并检查网络；连续失败就联系管理员，并附上网址和时间。

      **功能解释**

      偶发的 500 或超时，多半是服务重启或网络抖动。登录过期时重新登录即可。

      **注意事项**

      不要用刷新来重复提交会改数据的表单（导入、发送反馈包、造句）。能用「返回再进」就不要连点提交。

      **故障怎么办**

      记下完整网址、大概时间和屏幕上的错误句，发给管理员。不要把密码或完整邮件验证链接发到公开频道。
