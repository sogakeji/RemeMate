{% extends "public/base.html" %}
{% block content %}
<h1>{{ title }}</h1>
<p class="muted">{{ description }}</p>
<ul class="post-list">
  {% for post in posts %}
  <li>
    <time datetime="{{ post.date.isoformat() }}">{{ post.date.isoformat() }}</time>
    <a href="{{ url_for('public.post_zh' if locale == 'zh' else 'public.post_en', slug=post.slug) }}">{{ post.title }}</a>
    <p class="muted">{{ post.description }}</p>
  </li>
  {% endfor %}
</ul>
{% endblock %}
