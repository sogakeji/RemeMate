<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}记搭 RemeMate{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script>
    // 给所有 HTMX 请求带上 CSRF 头（Flask-WTF 接受 X-CSRFToken）
    document.addEventListener('htmx:configRequest', function (e) {
      var t = document.querySelector('meta[name="csrf-token"]');
      if (t) e.detail.headers['X-CSRFToken'] = t.getAttribute('content');
    });
  </script>
</head>
<body>
  {% if current_user.is_authenticated %}
  <nav>
    <a href="{{ url_for('main.index') }}">首页</a> ·
    <a href="{{ url_for('words.lists') }}">词库</a> ·
    <a href="{{ url_for('words.review') }}">复习</a> ·
    <a href="{{ url_for('write.compose') }}">造句</a> ·
    <a href="{{ url_for('words.stats') }}">统计</a> ·
    <a href="{{ url_for('auth.logout') }}">登出</a>
  </nav>
  {% endif %}
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul class="flashes">
        {% for m in messages %}<li>{{ m }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
