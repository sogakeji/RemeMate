{% extends "base.html" %}
{% block title %}快速加词 · 记搭{% endblock %}
{% block content %}
<h1>快速加词</h1>
<p><small>今日导入 {{ quota.used }}/{{ quota.limit }} 词 ·
  <a href="{{ url_for('intake.import_page') }}">CSV 导入</a> ·
  <a href="{{ url_for('intake.extract_page') }}">文本抽词</a></small></p>

{% if not lists %}
  <p>先去<a href="{{ url_for('words.lists') }}">建词表</a>。</p>
{% else %}
<form method="post" action="{{ url_for('intake.quick_add') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p>
    <label>词表
      <select name="word_list_id" required>
        {% for wl in lists %}<option value="{{ wl.id }}">{{ wl.name }}（{{ wl.language_code }}）</option>{% endfor %}
      </select>
    </label>
  </p>
  <p><input name="word" maxlength="140" required placeholder="词"></p>
  <p><input name="meaning" placeholder="释义（可选，留空让 AI 补全）"></p>
  <button type="submit">加词</button>
</form>
{% endif %}
{% endblock %}
