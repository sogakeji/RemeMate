{% extends "base.html" %}
{% block title %}快速加词 · 记搭{% endblock %}
{% block content %}
<div class="container">
  <div class="header-section">
    <h1>快速加词</h1>
    <p><small>今日导入 {{ quota.used }}/{{ quota.limit }} 词
      · <a class="nav-link" href="{{ url_for('intake.import_page') }}" style="display:inline;padding:2px 6px;">CSV 导入</a>
      · <a class="nav-link" href="{{ url_for('intake.extract_page') }}" style="display:inline;padding:2px 6px;">文本抽词</a></small></p>
  </div>

  {% if not lang_choices %}
  <div class="word-card" style="text-align:center;">
    <p style="margin-bottom:16px;color:var(--text-secondary);">先在设置里选择正在学的语言。</p>
    <a class="btn success" href="{{ url_for('main.settings') }}">去设置选语言</a>
  </div>
  {% else %}
  <div class="form-card">
    <form method="post" action="{{ url_for('intake.quick_add') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">语言
          <select name="language_code" class="form-control" required>
            {% for code, name in lang_choices %}
            <option value="{{ code }}" {% if code == current_language %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
          </select>
        </label>
      </div>
      <div class="form-group">
        <input name="word" maxlength="140" required class="form-control" placeholder="词">
      </div>
      <div class="form-group">
        <input name="meaning" class="form-control" placeholder="释义（可选，留空让 AI 补全）">
      </div>
      <button type="submit" class="btn primary">加词</button>
    </form>
  </div>
  {% endif %}
</div>
{% endblock %}
