{% extends "base.html" %}
{% block title %}文本抽词 · 记搭{% endblock %}
{% block content %}
<h1>文本抽词</h1>
<p><small>今日导入 {{ quota.used }}/{{ quota.limit }} 词 ·
  <a href="{{ url_for('intake.import_page') }}">CSV 导入</a> ·
  <a href="{{ url_for('intake.quick_add_page') }}">快速加词</a></small></p>

{% if not lists %}
  <p>先去<a href="{{ url_for('words.lists') }}">建词表</a>。</p>
{% else %}
<form method="post" action="{{ url_for('intake.extract') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <p>
    <label>词表
      <select name="word_list_id" required>
        {% for wl in lists %}<option value="{{ wl.id }}">{{ wl.name }}（{{ wl.language_code }}）</option>{% endfor %}
      </select>
    </label>
  </p>
  <p>
    <textarea name="text" rows="10" maxlength="{{ max_chars }}" required
              oninput="document.getElementById('cc').textContent=this.value.length"
              placeholder="粘贴文章/字幕（≤ {{ max_chars }} 字符），最多抽 50 个生词"></textarea><br>
    <small><span id="cc">0</span>/{{ max_chars }}</small>
  </p>
  <button type="submit">抽词</button>
</form>
{% endif %}
{% endblock %}
