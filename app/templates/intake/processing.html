{% extends "base.html" %}
{% block title %}{{ _('intake.processing') }} · RemeMate{% endblock %}
{% block content %}
<div class="container">
  <h1>{{ _('intake.processing') }}</h1>
  <div class="word-card">
    <p id="status" style="text-align:center;color:var(--text-secondary);">{{ _('intake.connecting') }}</p>
    <progress id="bar" value="0" max="1" style="width:100%;margin-top:16px;height:10px;border-radius:8px;"></progress>
  </div>
</div>

<script>
(function () {
  var progressTemplate = {{ _('intake.progress', done='__DONE__', total='__TOTAL__')|tojson }};
  var interrupted = {{ _('intake.interrupted')|tojson }};
  var sourceId = {{ source_id }};
  var es = new EventSource("{{ url_for('intake.process_stream', source_id=source_id) }}");
  var statusEl = document.getElementById("status");
  var bar = document.getElementById("bar");

  es.addEventListener("progress", function (e) {
    var d = JSON.parse(e.data);
    bar.max = d.total || 1;
    bar.value = d.done || 0;
    statusEl.textContent = progressTemplate.replace('__DONE__', d.done || 0).replace('__TOTAL__', d.total || 0);
  });
  es.addEventListener("done", function (e) {
    var d = JSON.parse(e.data);
    es.close();
    window.location = "{{ url_for('intake.candidates', source_id=source_id) }}";
  });
  es.addEventListener("error", function (e) {
    es.close();
    if (e.data) { try { statusEl.textContent = JSON.parse(e.data).message; } catch (x) {} }
    else { statusEl.textContent = interrupted; }
  });
})();
</script>
{% endblock %}
