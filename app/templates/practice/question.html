{% extends "base.html" %}
{% block title %}{{ _('practice.title') }} · RemeMate{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='practice.css') }}">
{% endblock %}
{% block content %}
<main class="practice-page">
  <div data-practice-root data-practice-screen="question"
       data-practice-voice-lang="{{ practice_session.language_code }}"
       data-practice-voice-locale="{{ voice_locale }}"
       data-practice-abandon-url="{{ url_for('practice.abandon', session_id=practice_session.id) }}"
       data-practice-voice-checking="{{ _('practice.voice_checking') }}"
       data-practice-voice-unsupported="{{ _('practice.voice_unsupported') }}"
       data-practice-voice-missing="{{ _('practice.voice_missing') }}"
       data-practice-voice-ready="{{ _('practice.voice_ready') }}"
       data-practice-voice-report-url="{{ url_for('practice.voice_unavailable') }}">
    <p class="practice-progress">{{ item.position + 1 }} / {{ practice_session.items|length }}</p>
  <section class="practice-card">
    <button type="button" class="practice-play" data-practice-play
            data-practice-sentence="{{ item.sentence }}"
            data-practice-replay-url="{{ url_for('practice.replay', session_id=practice_session.id, item_id=item.id) }}"
            aria-label="{{ _('practice.play') }}">
      {{ _('practice.play') }}
    </button>
    <p class="practice-voice-status" data-practice-voice-status></p>
    <p class="practice-prompt" lang="{{ voice_locale }}">
      {{ prompt_before }}<span class="practice-blank" aria-label="{{ _('practice.missing_word') }}">&nbsp;</span>{{ prompt_after }}
    </p>
    <form class="practice-form" method="post"
          action="{{ url_for('practice.submit', session_id=practice_session.id, item_id=item.id) }}"
          autocomplete="off">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="answer_duration_ms" data-practice-duration value="">
      <label class="practice-sr" for="practice-input">{{ _('practice.missing_word_or_phrase') }}</label>
      <input id="practice-input" name="answer" type="text" lang="{{ voice_locale }}"
             spellcheck="false" autocapitalize="off" autocorrect="off"
             placeholder="{{ _('practice.type_missing_word') }}" required>
      <button type="submit" class="btn primary">{{ _('practice.submit') }}</button>
    </form>
  </section>
  </div>
</main>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='practice.js') }}"></script>
{% endblock %}
