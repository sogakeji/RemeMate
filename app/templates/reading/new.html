{% extends "base.html" %}
{% block title %}上传阅读收词材料 · 记搭{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;">
  <h1>上传阅读收词材料</h1>

  <div class="form-card">
    <form method="post" action="{{ url_for('reading.create') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="language_code">语言</label>
        <select name="language_code" id="language_code" class="form-control" required>
          <option value="">请选择语言</option>
          <option value="zh" {% if current_lang == 'zh' %}selected{% endif %}>中文</option>
          <option value="en" {% if current_lang == 'en' %}selected{% endif %}>英文</option>
          <option value="ja" {% if current_lang == 'ja' %}selected{% endif %}>日文</option>
          <option value="fr" {% if current_lang == 'fr' %}selected{% endif %}>法文</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="file">选择 PDF 文件</label>
        <input type="file" name="file" id="file" accept=".pdf" class="form-control" required>
        <p style="color:var(--text-secondary);font-size:13px;margin-top:6px;">
          只支持文本型 PDF，不支持扫描件或 OCR。最多 25 MB / 80 页。
        </p>
      </div>

      <button type="submit" class="btn primary">上传并开始收词</button>
    </form>
  </div>
</div>
{% endblock %}
