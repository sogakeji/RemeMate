{% extends "base.html" %}
{% block title %}{{ _('reading.upload_title') }} · RemeMate{% endblock %}
{% block content %}
<div class="container" style="max-width:520px;">
  <h1>{{ _('reading.upload_title') }}</h1>

  <div class="form-card">
    <form method="post" action="{{ url_for('reading.create') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="language_code">{{ _('intake.language') }}</label>
        <select name="language_code" id="language_code" class="form-control" required>
          <option value="">{{ _('reading.choose_language') }}</option>
          {% for code in ('zh', 'en', 'ja', 'fr') %}
          <option value="{{ code }}" {% if current_lang == code %}selected{% endif %}>{{ language_names[code] }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="file">{{ _('reading.file') }}</label>
        <input type="file" name="file" id="file" accept=".pdf" class="form-control" required>
        <p style="color:var(--text-secondary);font-size:13px;margin-top:6px;">
          {{ _('reading.file_help') }}
        </p>
      </div>

      <button type="submit" class="btn primary">{{ _('reading.upload_start') }}</button>
    </form>
  </div>
</div>
{% endblock %}
