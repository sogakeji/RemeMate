{# app/templates/main/_task_card.html — 每日任务卡组件 #}
{% if task_card and task_card.items %}
<div class="task-card" id="task-card">
  <div class="task-card-header">
    <h2>今日任务</h2>
    {% if task_card.all_done %}
    <span class="task-done-badge">全部完成</span>
    {% endif %}
  </div>
  <ul class="task-list">
    {% for t in task_card.items %}
    <li class="task-item{% if t.done %} done{% endif %}">
      <a href="{{ t.href }}">
        <span class="task-title">{{ t.title }}</span>
        <span class="task-progress"
              data-slug="{{ t.slug }}"
              data-progress="{{ t.progress }}"
              data-goal="{{ t.goal }}">
          {{ t.progress }}/{{ t.goal }}
        </span>
        {% if t.done %}<span class="task-check">&#10003;</span>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endif %}
