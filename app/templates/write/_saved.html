<div class="word-card" style="margin-top:15px;">
  <p style="color:var(--success-color);">✅ {{ _('write.saved') }}</p>
  <div class="button-group" style="margin-top:14px;">
    {% if not entry.is_nsfw %}
      <button class="btn primary" hx-post="{{ url_for('write.publish', entry_id=entry.id) }}"
              hx-target="#write-result" hx-swap="innerHTML">{{ _('history.publish') }}</button>
    {% endif %}
    <a class="btn success" href="{{ url_for('write.compose') }}">{{ _('write.write_again') }}</a>
    <a class="btn default" href="{{ url_for('write.history') }}">{{ _('write.view_history') }}</a>
  </div>
</div>
